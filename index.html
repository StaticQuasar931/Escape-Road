<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- Enable indexing + set canonical -->
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://staticquasar931.github.io/Escape-Road/">
  <title>Escape Road</title>
  <meta name="description" content="Play Escape Road unblocked right in your browser. No redirects — the Unity WebGL build loads in this tab with a full-screen canvas and fast loading.">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="25011401/theme/game.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      font-family: "Fredoka", system-ui, -apple-system, Arial, sans-serif;
    }
    #unity-container {
      position: fixed;
      inset: 0;
      display: none;
      background: #000;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    #loadingBlock {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      z-index: 2;
      overflow: hidden;
    }
    .gameloader {
      max-width: 720px;
      width: 92vw;
      margin: 0 auto;
      text-align: center;
      position: relative;
    }
    .gameloader-game-name {
      font-size: 28px;
      margin-bottom: 14px;
      letter-spacing: .5px;
    }
    .gameloader-logo img {
      width: 160px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 24px rgba(255,255,255,.15);
    }
    .gameloader-progressbar {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,.15);
      border-radius: 999px;
      overflow: hidden;
      margin: 18px 0 10px;
    }
    .gameloader-progressbar-progress {
      width: 0%;
      height: 100%;
      background: #4caf50;
      transition: width .2s linear;
    }
    .gameloader-progress-info {
      font-size: 14px;
      opacity: .9;
    }
    .brand-watermark {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 14px;
      color: #ffffff;
      opacity: .5;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      margin: 0 auto 18px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Subtle blurred background while loading */
    .jss1:before {
      top: 0;
      width: 100%;
      filter: blur(16px);
      height: 100%;
      content: "";
      display: block;
      opacity: .5;
      z-index: 0;
      position: absolute;
      background-size: cover;
      background-position: center;
      background-image: url("25011401/loading.png");
    }

    /* Error area */
    #errorArea {
      display: none;
      color: #ff8080;
      font-size: 14px;
      margin-top: 10px;
      white-space: pre-wrap;
    }
  </style>

  <script>
    // ---------- Unity build + config ----------
    const versionFolder = "25011401/";
    const buildUrl = versionFolder + "Build";
    const loaderUrl = buildUrl + "/escape-road-v25011401.loader.js";

    const config = {
      dataUrl:       buildUrl + "/escape-road-v25011401.data.unityweb",
      frameworkUrl:  buildUrl + "/escape-road-v25011401.framework.js.unityweb",
      codeUrl:       buildUrl + "/escape-road-v25011401.wasm.unityweb",
      streamingAssetsUrl: versionFolder + "StreamingAssets",
      companyName: "azgames.io",
      productName: "Escape Road",
      productVersion: "25011401",
      pubId: "",
      // Helpful toggles for performance
      devicePixelRatio: Math.min(2, window.devicePixelRatio || 1),
      matchWebGLToCanvasSize: true
    };

    config.gameId = "escape-road";
    config.eventLog = true;
    // Make API paths relative so it works on GitHub Pages under /Escape-Road/
    config.buildAPI = "lib/event.json";

    // Stop event logging after a cutoff
    (function(){
      const endLogDate = new Date("2025-03-08T07:31:48.701Z");
      if (new Date() > endLogDate) config.eventLog = false;
    })();

    // Disable promotion if hosted on GameDistribution
    config.enableMoreGame = "yes";
    config.enablePromotion = true;
    (function(){
      const isHostOnGD = () => {
        const parts = location.hostname.split(".");
        const main = parts.slice(-2).join(".");
        return main === "gamedistribution.com";
      };
      if (isHostOnGD()) {
        config.enableMoreGame = "no";
        config.enablePromotion = false;
        config.eventLog = false;
        const pathSegments = location.pathname.split("/");
        config.gdGameId = pathSegments[1] || "";
      }
    })();
  </script>

  <!-- Make SDK path relative (works on GitHub Pages) -->
  <script id="gmsoft-jssdk" src="lib/gmsoftsdk_v5.js" defer></script>
</head>

<body>
  <!-- Button added: Play Escape Road 2 Unblocked -->
  <a href="https://sites.google.com/view/staticquasar931/gm3z/escape-road-2-fake-gta-2"
     style="position:fixed; top:50%; right:16px; transform:translateY(-50%); z-index:5; background:#4caf50; color:#fff; text-decoration:none; padding:12px 16px; border-radius:10px; font-weight:500; box-shadow:0 8px 20px rgba(0,0,0,.35);">

  <!-- Fullscreen canvas container -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="0"></canvas>
  </div>

  <!-- Loading UI -->
  <div id="loadingBlock">
    <div class="jss31 jss34 jss1" style="position: relative; display: grid; place-items: center; width: 100%; height: 100%;">
      <div class="brand-watermark">25011401</div>

      <div class="gameloader">
        <div class="spinner"></div>

          <div class="gameloader-progressbar-progress" id="progress_fill"></div>
        </div>
        <div class="gameloader-progress-info" id="progress_text">Initializing...</div>

        <img src="https://thegportal.net/GHub%20Logo%204.svg" alt="The G Portal" style="height: 80px; margin-top: 18px; opacity:.9;">
        <div id="errorArea"></div>
      </div>
    </div>
  </div>

  <!-- Unity loader + bootstrap -->
  <script>
    const progressEl = document.getElementById("progress_fill");
    const progressText = document.getElementById("progress_text");
    const container = document.getElementById("unity-container");
    const canvasEl = document.getElementById("unity-canvas");
    const loadingBlock = document.getElementById("loadingBlock");
    const errorArea = document.getElementById("errorArea");

    // Load the Unity loader script dynamically
    (function loadUnity() {
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.async = true;
      script.onload = () => {
        if (typeof createUnityInstance !== "function") {
          showError("Unity loader didn't expose createUnityInstance.");
          return;
        }
        createUnityInstance(canvasEl, config, (progress) => {
          const pct = Math.max(0, Math.min(1, progress));
          progressEl.style.width = (pct * 100).toFixed(1) + "%";
          progressText.textContent = pct >= 0.99 ? "Game Loading..." : ("Downloading file: " + Math.round(pct * 100) + "%");
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          container.style.display = "block";
          // Small delay to smooth transition
          setTimeout(() => {
            loadingBlock.style.display = "none";
            window.focus();
            canvasEl.focus();
          }, 600);
        }).catch((err) => {
          showError(String(err || "Failed to start Unity instance."));
        });
      };
      script.onerror = () => showError("Failed to load Unity loader script: " + loaderUrl);
      document.body.appendChild(script);
    })();

    function showError(msg) {
      errorArea.style.display = "block";
      errorArea.textContent = msg;
      progressText.textContent = "Error starting game";
    }

    // Keep canvas sized correctly on resize
    addEventListener("resize", () => {
      // Unity with matchWebGLToCanvasSize handles this, but we keep hook here if needed later
    });

    // Leave/reload warning
    window.onbeforeunload = function () {
      return "Are you sure you want to leave? Your game session may be lost.";
    };
  </script>
