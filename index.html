<head>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      font-family: "Fredoka", system-ui, -apple-system, Arial, sans-serif;
    }
    #unity-container {
      position: fixed;
      inset: 0;
      display: none;
      background: #000;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    #loadingBlock {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      z-index: 2;
      overflow: hidden;
    }
    .gameloader {
      max-width: 720px;
      width: 92vw;
      margin: 0 auto;
      text-align: center;
      position: relative;
    }
    .gameloader-game-name {
      font-size: 28px;
      margin-bottom: 14px;
      letter-spacing: .5px;
    }
    .gameloader-logo img {
      width: 160px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 0 24px rgba(255,255,255,.15);
    }
    .gameloader-progressbar {
      width: 100%;
      height: 12px;
      background: rgba(255,255,255,.15);
      border-radius: 999px;
      overflow: hidden;
      margin: 18px 0 10px;
    }
    .gameloader-progressbar-progress {
      width: 0%;
      height: 100%;
      background: #4caf50;
      transition: width .2s linear;
    }
    .gameloader-progress-info {
      font-size: 14px;
      opacity: .9;
    }
    .brand-watermark {
      position: absolute;
      bottom: 10px;
      right: 10px;
      font-size: 14px;
      color: #ffffff;
      opacity: .5;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      margin: 0 auto 18px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Subtle blurred background while loading */
    .jss1:before {
      top: 0;
      width: 100%;
      filter: blur(16px);
      height: 100%;
      content: "";
      display: block;
      opacity: .5;
      z-index: 0;
      position: absolute;
      background-size: cover;
      background-position: center;
      background-image: url("25011401/loading.png");
    }

    /* Error area */
    #errorArea {
      display: none;
      color: #ff8080;
      font-size: 14px;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    /* ===== Visual SEO - your standard block (shifted right by ~50px for this page) ===== */
    :root{
      --brand:#5ee1ff;
      --glow:0 0 12px rgba(94,225,255,.65), 0 0 32px rgba(155,255,183,.35);
      --shadow:0 10px 30px rgba(0,0,0,.4);
    }
    /* Static Menu (top-left, shifted 50px to the right) */
    #staticMenu{
      position:fixed; left:140px; top:12px; z-index:9999; /* 12px + 50px = 62px */
      display:flex; gap:10px; align-items:center; user-select:none;
      padding:10px 14px; border-radius:12px;
      background:linear-gradient(135deg, rgba(20,20,28,.9), rgba(20,20,28,.6));
      border:1px solid rgba(94,225,255,.35);
      color:#e8f3ff; box-shadow:var(--glow), var(--shadow);
      font-size:14px; animation:menuEnter .6s ease .15s both;
    }
    #staticMenu a{ color:#5ee1ff; font-weight:800; text-decoration:none }
    #closeStaticMenu{
      color:#f55; cursor:pointer; padding:2px 6px; border-radius:6px;
      border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06)
    }
    @keyframes menuEnter{ from{opacity:0; transform:translateY(-8px)} to{opacity:1; transform:translateY(0)} }

    /* Rotating slide-in widget (bottom-right) */
    #staticSlideMenu{
      position:fixed; bottom:24px; right:24px; z-index:9999;
      width:100px; height:100px; pointer-events:none; opacity:0;
      transform:translateX(140px) scale(.96);
    }
    #staticSlideMenu a{ display:block; width:100%; height:100% }
    #staticSlideMenu img{
      width:100%; height:100%; object-fit:contain;
      border:0; border-radius:0; background:transparent; box-shadow:none;
      transition:opacity .25s ease;
    }
    .slide-in{ animation:slideIn 2s ease forwards }
    .slide-out{ animation:slideOut 2s ease forwards }
    @keyframes slideIn{ from{opacity:0; transform:translateX(140px) scale(.96)} to{opacity:1; transform:translateX(0) scale(1)} }
    @keyframes slideOut{ from{opacity:1; transform:translateX(0) scale(1)} to{opacity:0; transform:translateX(140px) scale(.96)} }

    .seo-hidden{
      position:absolute; width:1px; height:1px; overflow:hidden;
      clip:rect(1px,1px,1px,1px); white-space:nowrap;
    }

    @media (max-width:600px){
      #staticMenu{ font-size:13px; padding:8px 12px }
      #staticSlideMenu{ width:88px; height:88px }
    }
  </style>

    const config = {
      dataUrl:       buildUrl + "/escape-road-v25011401.data.unityweb",
      frameworkUrl:  buildUrl + "/escape-road-v25011401.framework.js.unityweb",
      codeUrl:       buildUrl + "/escape-road-v25011401.wasm.unityweb",
      streamingAssetsUrl: versionFolder + "StreamingAssets",
      companyName: "azgames.io",
      productName: "Escape Road",
      productVersion: "25011401",
      pubId: "",
      devicePixelRatio: Math.min(2, window.devicePixelRatio || 1),
      matchWebGLToCanvasSize: true
    };

    config.gameId = "escape-road";
    config.eventLog = true;
    config.buildAPI = "lib/event.json";

    (function(){
      const endLogDate = new Date("2025-03-08T07:31:48.701Z");
      if (new Date() > endLogDate) config.eventLog = false;
    })();

    config.enableMoreGame = "yes";
    config.enablePromotion = true;
    (function(){
      const isHostOnGD = () => {
        const parts = location.hostname.split(".");
        const main = parts.slice(-2).join(".");
        return main === "gamedistribution.com";
      };
      if (isHostOnGD()) {
        config.enableMoreGame = "no";
        config.enablePromotion = false;
        config.eventLog = false;
        const pathSegments = location.pathname.split("/");
        config.gdGameId = pathSegments[1] || "";
      }
    })();
  </script>

  <!-- Unity loader + bootstrap -->
  <script>
    const progressEl = document.getElementById("progress_fill");
    const progressText = document.getElementById("progress_text");
    const container = document.getElementById("unity-container");
    const canvasEl = document.getElementById("unity-canvas");
    const loadingBlock = document.getElementById("loadingBlock");
    const errorArea = document.getElementById("errorArea");

    // Load the Unity loader script dynamically
    (function loadUnity() {
      const script = document.createElement("script");
      script.src = loaderUrl;
      script.async = true;
      script.onload = () => {
        if (typeof createUnityInstance !== "function") {
          showError("Unity loader didn't expose createUnityInstance.");
          return;
        }
        createUnityInstance(canvasEl, config, (progress) => {
          const pct = Math.max(0, Math.min(1, progress));
          progressEl.style.width = (pct * 100).toFixed(1) + "%";
          progressText.textContent = pct >= 0.99 ? "Game Loading..." : ("Downloading file: " + Math.round(pct * 100) + "%");
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          container.style.display = "block";
          setTimeout(() => {
            loadingBlock.style.display = "none";
            window.focus();
            canvasEl.focus();
          }, 600);
        }).catch((err) => {
          showError(String(err || "Failed to start Unity instance."));
        });
      };
      script.onerror = () => showError("Failed to load Unity loader script: " + loaderUrl);
      document.body.appendChild(script);
    })();

    function showError(msg) {
      errorArea.style.display = "block";
      errorArea.textContent = msg;
      progressText.textContent = "Error starting game";
    }

    // Leave/reload warning
    window.onbeforeunload = function () {
      return "Are you sure you want to leave? Your game session may be lost.";
    };
  </script>

  <script>
    // Visual SEO - Leave warning already set above for page

    // Static Menu show/hide with 3 minute return
    (function(){
      const menu = document.getElementById("staticMenu");
      const btn  = document.getElementById("closeStaticMenu");
      const KEY  = "sq931_staticMenu_hidden_until";
      const show = () => { if (menu) menu.style.display = "flex"; };
      const hideFor3m = () => {
        if (!menu) return;
        menu.style.display = "none";
        const until = Date.now() + 180000;
        localStorage.setItem(KEY, String(until));
        setTimeout(show, 180000);
      };
      const until = parseInt(localStorage.getItem(KEY)||"0", 10);
      if (until && Date.now() < until){
        if (menu) menu.style.display = "none";
        setTimeout(show, until - Date.now());
      } else {
        show();
      }
      if (btn) btn.onclick = hideFor3m;
    })();

    // Rotator: Google Form -> Discord -> Instagram
    (function(){
      const wrap = document.getElementById("staticSlideMenu");
      const a    = document.getElementById("staticSlideLink");
      const img  = document.getElementById("staticSlideImg");

      const FORM = {
        src:  "https://cdn.jsdelivr.net/gh/StaticQuasar931/Images@main/GoogleForm.png",
        alt:  "StaticQuasar931 Google Form for feedback and requests",
        link: "https://sites.google.com/view/staticquasar931/google-form"
      };
      const DISCORD = {
        src:  "https://cdn.jsdelivr.net/gh/StaticQuasar931/Images@main/Join_Our_DC_StaticQuassar931_lcplrf.png",
        alt:  "Join the StaticQuasar931 Discord",
        link: "https://discord.gg/DP2hM7RRhR"
      };
      const INSTA = {
        src:  "https://cdn.jsdelivr.net/gh/StaticQuasar931/Images@main/Follow-us--IG",
        alt:  "StaticQuasar931 Instagram",
        link: "https://www.instagram.com/freeschoolgamepage/"
      };
      const ROTATION = [FORM, DISCORD, INSTA];

      // Preload
      ROTATION.forEach(o => { const p = new Image(); p.src = o.src; });

      const T_IN = 2000, T_SHOW = 5000, T_OUT = 2000, T_HIDDEN = 20000;
      let idx = 0;

      function apply(state){
        a.href = state.link;
        img.alt = state.alt;
        img.style.opacity = "0";
        setTimeout(() => { img.src = state.src; }, 80);
        img.onload = () => { img.style.opacity = "1"; };
      }
      function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

      (async function cycle(){
        for(;;){
          apply(ROTATION[idx]);
          wrap.style.pointerEvents = "auto";
          wrap.classList.remove("slide-out");
          wrap.classList.add("slide-in");
          await delay(T_IN + T_SHOW);
          wrap.classList.remove("slide-in");
          wrap.classList.add("slide-out");
          await delay(T_OUT);
          wrap.style.pointerEvents = "none";
          await delay(T_HIDDEN);
          idx = (idx + 1) % ROTATION.length;
        }
      })();
    })();

    // Secret toggle: y u i to toggle Visual SEO visibility
    (function(){
      const idsToToggle = ["staticMenu", "staticSlideMenu"];
      let seq = [];
      const target = ["y","u","i"];
      function toggle(){
        idsToToggle.forEach(id=>{
          const el = document.getElementById(id);
          if(!el) return;
          const isHidden = (el.style.display === "none" || getComputedStyle(el).display === "none");
          el.style.display = isHidden ? (id === "staticMenu" ? "flex" : "block") : "none";
        });
      }
      window.addEventListener("keydown", (e)=>{
        seq.push(e.key.toLowerCase());
        if (seq.length > 3) seq.shift();
        if (seq.join("") === target.join("")) toggle();
      });
    })();
  </script>
